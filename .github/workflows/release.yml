name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CVDv2-${{ github.ref_name }}-windows.exe
          - os: macos-latest
            artifact: CVDv2-${{ github.ref_name }}-macos-arm64
          - os: ubuntu-22.04
            artifact: CVDv2-${{ github.ref_name }}-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync
        
      - name: Verify version matches tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG_VERSION pyproject=$PY_VERSION"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::태그 버전($TAG_VERSION)과 pyproject.toml 버전($PY_VERSION)이 다릅니다."
            exit 1
          fi

      - name: Resolve build version (manual run only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          PY_VERSION=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "MANUAL_BUILD_VERSION=${PY_VERSION%%-*}" >> "$GITHUB_ENV"
          echo "manual build version: ${PY_VERSION%%-*} (pyproject=$PY_VERSION, ref=$GITHUB_REF)"

      # patchelf: Nuitka onefile 필수 / 나머지: 기동 스모크(xvfb)에서 Qt 런타임에 필요
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 imagemagick

      - name: Verify ffmpeg (3-OS)
        run: uv run pytest -q -k ffmpeg
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Inject build info (release marker)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: uv run python scripts/inject_build_info.py --release

      - name: Inject build info (manual run — no release marker)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: uv run python scripts/inject_build_info.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          VERSION_NUM="${VERSION_NUM%%-*}"
          VERSION_NUM="${MANUAL_BUILD_VERSION:-$VERSION_NUM}"
          uv run python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --windows-console-mode=disable \
            --windows-icon-from-ico=resources/icon.ico \
            --company-name=honey720 \
            --product-name="Chzzk VOD Downloader" \
            --file-description="Chzzk VOD Downloader v2" \
            --file-version="$VERSION_NUM" \
            --product-version="$VERSION_NUM" \
            --copyright="honey720" \
            --include-data-dir=resources=resources \
            --include-data-dir=translations=translations \
            --output-filename="${{ matrix.artifact }}" \
            --output-dir=build \
            CVDv2.py

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          uv run python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --enable-plugin=pyside6
          --macos-create-app-bundle
          --macos-app-icon=resources/icon.icns
          --macos-app-name=CVDv2
          --include-data-dir=resources=resources
          --include-data-dir=translations=translations
          --output-dir=build
          CVDv2.py

      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          ls -la
          # 앱 묶음 이름은 진입점 스크립트 이름에서 나온다 — CVDv2.py라 처음부터 CVDv2.app이다(#452)
          zip -qr "${{ matrix.artifact }}.zip" CVDv2.app

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          uv run python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --enable-plugin=pyside6
          --include-data-dir=resources=resources
          --include-data-dir=translations=translations
          --output-filename=${{ matrix.artifact }}
          --output-dir=build
          CVDv2.py

      # ── 기동 스모크: 산출물을 실제로 실행해 30초 생존 확인 ──
      - name: Boot smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "build\${{ matrix.artifact }}" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "::error::기동 스모크 실패 — 프로세스가 조기 종료됨 (exit $($p.ExitCode))"
            exit 1
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = New-Object Drawing.Bitmap 1280,800
            $g = [Drawing.Graphics]::FromImage($b)
            $g.CopyFromScreen(0,0,0,0,$b.Size)
            $b.Save("win-smoke.png")
          } catch { Write-Host "스크린샷 생략: $_" }
          Stop-Process -Id $p.Id -Force
          Write-Host "기동 스모크 통과 (30초 생존)"

      - name: Boot smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "build/${{ matrix.artifact }}"
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 3
          "build/${{ matrix.artifact }}" &
          PID=$!
          sleep 30
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::기동 스모크 실패 — 프로세스가 조기 종료됨"
            exit 1
          fi
          import -window root linux-smoke.png || true
          kill $PID || true
          echo "기동 스모크 통과 (30초 생존)"

      - name: Boot smoke + screenshot (macOS)
        if: runner.os == 'macOS'
        run: |
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" build/CVDv2.app/Contents/Info.plist)
          BIN="build/CVDv2.app/Contents/MacOS/$EXEC"
          echo "실행 대상: $BIN"
          "$BIN" &
          PID=$!
          sleep 30
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::기동 스모크 실패 — 프로세스가 조기 종료됨"
            exit 1
          fi
          # 스크린샷은 best-effort (러너 세션 상태에 따라 검은 화면일 수 있음)
          screencapture -x mac-smoke.png || true
          kill $PID || true
          echo "기동 스모크 통과 (30초 생존)"

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-screenshot-${{ matrix.os }}
          path: |
            mac-smoke.png
            linux-smoke.png
            win-smoke.png
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.artifact }}
            build/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read   # 노트 스크립트가 머지된 PR의 라벨 · 본문을 읽는다
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # 직전 정식 태그부터의 이력 · .github/release-notes/

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      # 스크린샷은 릴리즈 자산이 아니므로 제외
      - name: Exclude non-release files
        run: rm -f dist/*.png

      # 릴리즈 생성 전에 스캔 → 링크를 본문에 직접 주입 (태그 이벤트에서도 확실히 동작)
      - name: VirusTotal scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/*

      - name: Format VT links
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          {
            echo '### 🛡 VirusTotal 검사 결과'
            echo ''
            IFS=',' read -ra items <<< "$ANALYSIS"
            for i in "${items[@]}"; do
              name="${i%%=*}"; url="${i#*=}"
              echo "- \`${name##*/}\`: [분석 보기](${url})"
            done
            echo ''
            echo '> Windows Defender 등에서 경고가 뜰 수 있으나, 이는 Python 컴파일 실행파일에서 흔한 머신러닝 휴리스틱 오탐입니다. 위 링크에서 전체 엔진 검사 결과를 확인할 수 있습니다.'
          } > vt.md

      # 직전 정식 태그 뒤 머지된 PR(제외 라벨 없는 것)로 Messages API를 한 번 부른다.
      # 실패 · 빈 응답 · PR 번호 불일치는 notes.md 맨 위에 경고로 남고 초안은 그대로 만든다
      - name: AI release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/release-notes/make_notes.py --tag "$GITHUB_REF_NAME" --out notes.md \
            || echo '> ⚠️ **초안 확인 필요**: 노트 스크립트가 실패했다 — 로그를 본다' > notes.md

      - name: Full change list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(python3 -c "import json;print(json.load(open('notes.inputs.json')).get('prev') or '')" 2>/dev/null || true)
          ARGS=(-f tag_name="$GITHUB_REF_NAME")
          [ -n "$PREV" ] && ARGS+=(-f previous_tag_name="$PREV")
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq '.body')
          {
            echo '<details>'
            echo '<summary>전체 변경 목록</summary>'
            echo ''
            echo "$NOTES"
            echo ''
            echo '</details>'
          } > changes.md

      # 본문 순서: rc 안내(rc만) → AI 노트 → VirusTotal → 전체 변경 목록(접기)
      - name: Assemble release body
        run: |
          {
            case "$GITHUB_REF_NAME" in
              *-*)
                echo '> 정식 출시 전에 확인하는 시험판(rc)입니다. 문제가 보이면 이슈로 알려 주세요.'
                echo ''
                ;;
            esac
            cat notes.md
            echo ''
            echo '---'
            cat vt.md
            echo ''
            cat changes.md
          } > body.md

      # 초안으로 만든다 — 소유자가 노트를 읽고 고친 뒤 Publish한다. 초안은 쓰기 권한이 있는 사람만 본다
      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          body_path: body.md
          draft: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

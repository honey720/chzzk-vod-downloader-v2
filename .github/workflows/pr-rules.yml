name: PR rules

# PR 제목 · 본문 템플릿 · 브랜치 · 라벨 · 마일스톤 · Closes/Refs · 공개 금지 꼴을 검사한다.
# 룰셋 필수 체크 'pr-rules'로 걸면 block 항목이 남은 PR은 머지되지 않는다. warn은 주석으로만 남는다.
# 검사 정본은 .github/scripts/rule_checks.py(git hook · Claude Code hook과 같은 파일).
#
# 제목 · 본문은 이벤트 파일(GITHUB_EVENT_PATH)에서 파이썬이 읽는다 — run: 안에
# ${{ github.event.pull_request.title }}을 직접 쓰면 제목에 든 $(...) · 백틱이 셸 명령으로 실행된다(명령 주입).
# 마일스톤을 달거나 떼면 다시 돈다(milestoned · demilestoned — pull_request 활동 유형).
on:
  pull_request:
    branches: [main, 'dev-*']
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 검사기는 PR 쪽이 아니라 base 쪽 것을 쓴다 — PR이 자기 검사기를 고쳐 통과하지 못하게
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
      - name: Check PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # base에 검사기가 아직 없으면(검사기가 들어간 뒤 첫 릴리즈 PR의 main 등) 건너뛴다
          if [ ! -f .github/scripts/pr_rules.py ]; then
            echo "::notice title=pr-rules::base($BASE_REF)에 검사기가 없어 건너뜀"
            exit 0
          fi
          python3 -X utf8 .github/scripts/pr_rules.py

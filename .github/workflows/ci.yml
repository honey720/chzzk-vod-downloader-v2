name: CI

on:
  pull_request:
    branches: [main, 'dev-*']

jobs:
  # .github/ 을 소유자 외의 주체(에이전트 포함)가 수정하면 실패.
  # 테스트 실행 여부도 여기서 정한다 — chore/ 브랜치는 워크플로를 바꿨을 때만 테스트한다
  protected-paths:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.scope.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide test scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if [[ "$HEAD_REF" != chore/* || "$HEAD_REF" == chore/version-* || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]] \
             || echo "$CHANGED" | grep -qE '^\.github/workflows/'; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi
          tail -1 "$GITHUB_OUTPUT"
      - name: Check protected paths
        if: github.actor != github.repository_owner
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^\.github/' ; then
            echo "::error::보호 경로(.github/)는 소유자만 수정할 수 있습니다."
            exit 1
          fi

  test:
    needs: protected-paths
    if: needs.protected-paths.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          save-cache: false   # PR은 복원만 한다. 저장은 uv-cache.yml

      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 \
            fonts-dejavu-core
          # 한글 폰트는 스크린샷 글자용이다 — 라틴 폰트(DejaVu)만 있어도 테스트 결과는 같다.
          # 느린 미러에서 멈추면 건너뛴다
          sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            fonts-nanum || echo "::warning::fonts-nanum 설치를 건너뛰었다(느린 미러)"
          fc-list : family | sort -u

      - name: Sync dependencies
        timeout-minutes: 5
        shell: bash
        run: uv sync || uv sync

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check .

      # 리눅스: 기존 검증 구성(xvfb) 유지 — 실플랫폼(xcb)에 가장 근접
      - name: Test (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          CVDV2_SHOT_DIR: test-screenshots
        run: xvfb-run -a uv run pytest --maxfail=5 -q -n auto --dist loadfile --durations=30

      # Windows·macOS: offscreen — release.yml 기동 스모크와 같은 방식.
      # QT_QPA_FONTDIR 지정 필수: offscreen은 시스템 폰트를 자동으로 쓰지
      # 않아 미지정 시 한글이 전부 □로 렌더된다 (#154 실측)
      - name: Test (Windows/macOS, offscreen)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '/System/Library/Fonts' }}
          CVDV2_SHOT_DIR: test-screenshots
        run: uv run pytest --maxfail=5 -q -n auto --dist loadfile --durations=30

      # 실패한 GUI 테스트의 위젯 캡처(conftest 훅)를 OS별 아티팩트로.
      # 실패가 없으면 업로드 자체가 생략된다
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ matrix.os }}
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 14
  # 룰셋(protect main branch)의 필수 체크 'lint-test'로 보고하는 집계 관문.
  # 매트릭스 OS가 하나라도 실패·취소되면 실패한다. 테스트를 건너뛴 PR(chore/)은
  # skipped도 통과로 보되, 테스트 범위를 정한 protected-paths가 성공했을 때만이다
  lint-test:
    needs: [protected-paths, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All OS jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SCOPE_RESULT: ${{ needs.protected-paths.result }}
        run: |
          case "$TEST_RESULT" in
            success) ;;
            skipped)
              if [ "$SCOPE_RESULT" != "success" ]; then
                echo "::error::테스트 범위 판정 결과: $SCOPE_RESULT"
                exit 1
              fi ;;
            *)
              echo "::error::매트릭스 결과: $TEST_RESULT"
              exit 1 ;;
          esac

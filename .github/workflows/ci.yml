name: CI

on:
  pull_request:
    branches: [main, 'dev-*']

# 같은 PR에 새 커밋이 푸시되면 앞 커밋의 실행을 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # .github/ · scripts/release_notes.py 를 소유자 외의 주체(에이전트 포함)가 수정하면 실패.
  # 테스트 실행 여부도 여기서 정한다 — chore/ 브랜치는 워크플로를 바꿨을 때만 테스트한다
  protected-paths:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.scope.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Decide test scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if [[ "$HEAD_REF" != chore/* || "$HEAD_REF" == chore/version-* || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]] \
             || echo "$CHANGED" | grep -qE '^(\.github/workflows/|scripts/release_notes\.py$)'; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi
          tail -1 "$GITHUB_OUTPUT"
      - name: Check protected paths
        if: github.actor != github.repository_owner
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(\.github/|scripts/release_notes\.py$)' ; then
            echo "::error::보호 경로(.github/ · scripts/release_notes.py)는 소유자만 수정할 수 있습니다."
            exit 1
          fi

  test:
    needs: protected-paths
    if: needs.protected-paths.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 테스트를 둘로 나눠 나란히 돈다 — gui = tests/app/gui, rest = 그 밖.
        # ubuntu는 나누지 않는다(all) — tests/app/gui만 따로 돌리면 xvfb에서
        # test_theme_switch.py가 실패한다(PR #573 실행 43024938567, 원인 조사 중)
        part: [gui, rest]
        exclude:
          - os: ubuntu-latest
        include:
          - os: ubuntu-latest
            part: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          save-cache: false   # PR은 복원만 한다. 저장은 uv-cache.yml

      # 시스템 패키지(.deb)는 dev push가 GitHub 캐시에 저장해 둔 것을 쓴다(dev-push-test.yml).
      # 캐시가 있으면 Ubuntu 서버에 접속하지 않는다 — 러너가 그 서버 이름을 못 찾는 날에도 돈다.
      # 캐시가 없거나 맞지 않으면 apt로 받는다(.github/scripts/qt-deps.sh)
      - name: Runner image (Linux)
        id: image
        if: runner.os == 'Linux'
        run: |
          echo "os=${ImageOS:-unknown}-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          tail -2 "$GITHUB_OUTPUT"

      - name: Restore Qt system deps (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.image.outputs.os }}-${{ hashFiles('.github/scripts/qt-deps.sh') }}-${{ steps.image.outputs.version }}
          # 러너 이미지 판이 바뀐 직후에는 앞 판의 캐시로 먼저 해 본다
          restore-keys: |
            apt-debs-${{ steps.image.outputs.os }}-${{ hashFiles('.github/scripts/qt-deps.sh') }}-

      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          bash .github/scripts/qt-deps.sh
          fc-list : family | sort -u

      - name: Sync dependencies
        timeout-minutes: 5
        shell: bash
        run: uv sync || uv sync

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check .

      # 리눅스: 기존 검증 구성(xvfb) 유지 — 실플랫폼(xcb)에 가장 근접
      - name: Test (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          CVDV2_SHOT_DIR: test-screenshots
        run: xvfb-run -a uv run pytest --maxfail=5 -q -rs -n auto --dist loadfile --max-worker-restart 0 --durations=30 ${{ matrix.part == 'gui' && 'tests/app/gui' || matrix.part == 'rest' && '--ignore=tests/app/gui' || '' }}

      # Windows·macOS: offscreen — release.yml 기동 스모크와 같은 방식.
      # QT_QPA_FONTDIR 지정 필수: offscreen은 시스템 폰트를 자동으로 쓰지
      # 않아 미지정 시 한글이 전부 □로 렌더된다 (#154 실측)
      - name: Test (Windows/macOS, offscreen)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '/System/Library/Fonts' }}
          CVDV2_SHOT_DIR: test-screenshots
        run: uv run pytest --maxfail=5 -q -rs -n auto --dist loadfile --max-worker-restart 0 --durations=30 ${{ matrix.part == 'gui' && 'tests/app/gui' || matrix.part == 'rest' && '--ignore=tests/app/gui' || '' }}

      # 실패한 GUI 테스트의 위젯 캡처(conftest 훅)를 OS별 아티팩트로.
      # 실패가 없으면 업로드 자체가 생략된다
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-screenshots-${{ matrix.os }}-${{ matrix.part }}
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 14
  # 룰셋(protect main branch)의 필수 체크 'lint-test'로 보고하는 집계 관문.
  # 매트릭스 OS가 하나라도 실패·취소되면 실패한다. 테스트를 건너뛴 PR(chore/)은
  # skipped도 통과로 보되, 테스트 범위를 정한 protected-paths가 성공했을 때만이다
  lint-test:
    needs: [protected-paths, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All OS jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SCOPE_RESULT: ${{ needs.protected-paths.result }}
        run: |
          case "$TEST_RESULT" in
            success) ;;
            skipped)
              if [ "$SCOPE_RESULT" != "success" ]; then
                echo "::error::테스트 범위 판정 결과: $SCOPE_RESULT"
                exit 1
              fi ;;
            *)
              echo "::error::매트릭스 결과: $TEST_RESULT"
              exit 1 ;;
          esac

name: dev push test

# dev-* 에 머지된 뒤의 합쳐진 상태를 테스트한다 — PR CI는 PR 하나씩만 보므로,
# 따로 통과한 두 PR이 합쳐져 깨지는 것(#556 + #558 → #559)을 여기서 잡는다.
# ubuntu 하나만 돈다(3-OS는 PR CI가 맡는다). 단계는 ci.yml의 test job과 같게 둔다
on:
  push:
    branches: ['dev-*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          save-cache: false   # 저장은 uv-cache.yml

      # 시스템 패키지(.deb)를 GitHub 캐시에 둔다 — PR CI(ci.yml)가 복원해 쓴다. 키가 같은 캐시가
      # 있으면 그것으로 설치하고, 없으면(.github/scripts/qt-deps.sh나 러너 이미지 판이 바뀜)
      # apt로 받아 설치한 뒤 저장한다
      - name: Runner image
        id: image
        run: |
          echo "os=${ImageOS:-unknown}-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          tail -2 "$GITHUB_OUTPUT"

      - name: Restore Qt system deps
        id: debs
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.image.outputs.os }}-${{ hashFiles('.github/scripts/qt-deps.sh') }}-${{ steps.image.outputs.version }}

      - name: Install Qt system deps
        timeout-minutes: 5
        run: |
          bash .github/scripts/qt-deps.sh
          fc-list : family | sort -u

      - name: Save Qt system deps
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.image.outputs.os }}-${{ hashFiles('.github/scripts/qt-deps.sh') }}-${{ steps.image.outputs.version }}

      - name: Sync dependencies
        timeout-minutes: 5
        run: uv sync || uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test (xvfb)
        run: xvfb-run -a uv run pytest --maxfail=5 -q -rs -n auto --dist loadfile --max-worker-restart 0 --durations=30

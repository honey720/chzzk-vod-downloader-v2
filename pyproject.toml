[project]
name = "cvdv2"
version = "2.11.2"
description = "Chzzk VOD Downloader v2"
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "platformdirs>=4.11.4",
    "pycryptodome>=3.20",
    "PySide6>=6.11.2",
    "requests>=2.32.5",
    "shiboken6>=6.8.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "nuitka[onefile]",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "urllib3>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# 파일별 린트 예외는 없다 — 마지막 uic 생성물(ui/mainWindow.py)을 메인 창 코드 전환(#492)에서 없앴다.

[tool.ruff.lint]
# 기본 규칙에 반환 타입힌트 규칙만 더한다(1단계). 매개변수 타입힌트 규칙(ANN001 등)은 켜지 않는다
extend-select = ["ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 테스트 하나(셋업 · 정리 포함)가 이 초를 넘기면 모든 스레드의 스택을 출력에 남긴다 — CI가 출력 없이
# 멈췄을 때 어느 테스트인지 알기 위함. 가장 긴 테스트의 세 배가 넘는 값이다.
# faulthandler_exit_on_timeout은 켜지 않는다 — xdist가 같은 테스트를 새 워커에서 되풀이한다
faulthandler_timeout = 120

[project]
name = "cvdv2"
version = "2.10.0-rc1"
description = "Chzzk VOD Downloader v2"
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "platformdirs>=4.11.4",
    "pycryptodome>=3.20",
    "PySide6>=6.8.1.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "nuitka[onefile]",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# ui/mainWindow.py는 pyside6-uic 자동 생성 파일(.ui 원본 존재)이다. 수동으로 미사용 import를
# 지워도 재생성 시 되살아나므로 F401 예외를 유지한다 (#32). 손으로 작성한 파일의
# 예외는 전부 해소되어 제거됨. 설정 화면은 #244 ③에서 코드로 옮겨 생성물이 없다 —
# 예외를 파일 단위로 좁혀 새 파일이 이 예외 아래로 들어오지 않게 한다.
"ui/mainWindow.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
